services:
  - type: web
    name: cta-delay-api
    runtime: python
    rootDir: cta-delay-predictor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false         # set manually in Render dashboard
      - key: CTA_TRAIN_TRACKER_KEY
        sync: false         # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false         # set to your Vercel URL once deployed
