name: Load GTFS Schedule Data

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 6am UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  load-gtfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cta-delay-predictor/requirements-collector.txt

      - name: Install dependencies
        run: pip install -r cta-delay-predictor/requirements-collector.txt

      - name: Download and load CTA GTFS data
        working-directory: cta-delay-predictor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.gtfs.loader
