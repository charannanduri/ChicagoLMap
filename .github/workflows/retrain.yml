name: Retrain Model

on:
  schedule:
    - cron: '0 5 * * 0'    # every Sunday at 5am UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cta-delay-predictor/requirements-train.txt

      - name: Install dependencies
        run: pip install -r cta-delay-predictor/requirements-train.txt

      - name: Train model
        working-directory: cta-delay-predictor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.ml.train

      - name: Commit model artifacts so Render picks them up
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cta-delay-predictor/ml_models/*.joblib
          git diff --cached --quiet && echo "No model changes to push" && exit 0
          git commit -m "chore: update trained model artifacts [skip ci]"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main
            git rebase origin/main
            git push && exit 0
            echo "Push failed, retrying in 30s..."
            sleep 30
          done
          echo "All push attempts failed"
          exit 1

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-models-${{ github.run_id }}
          path: cta-delay-predictor/ml_models/
          retention-days: 90
