services:
  # ── Flask map app — production (auto-deploys from main branch) ──────────────
  - type: web
    name: chicagolmap
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind "0.0.0.0:$PORT" --workers 2
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: CTA_API_KEY
        sync: false           # set in Render dashboard
      - key: DELAY_PREDICTOR_URL
        sync: false           # set to https://cta-delay-api.onrender.com
      - key: SITE_ENV
        value: production

  # ── Delay predictor FastAPI ──────────────────────────────────────────────────
  - type: web
    name: cta-delay-api
    runtime: python
    rootDir: cta-delay-predictor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: CTA_TRAIN_TRACKER_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://chicagolmap.onrender.com,https://chicagolmap-dev.onrender.com"
