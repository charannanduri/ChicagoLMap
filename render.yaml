services:
  # ── Flask map app — production (auto-deploys from main branch) ──────────────
  - type: web
    name: chicagolmap
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    # One worker, not two. This process now loads the delay model
    # (numpy/pandas/sklearn/xgboost, roughly 220 MB) and a free instance has
    # 512 MB, so two workers would each hold their own copy and exhaust it.
    # The app is I/O-bound on CTA API calls, so threads cover the concurrency
    # that the second worker used to.
    startCommand: gunicorn app:app --bind "0.0.0.0:$PORT" --workers 1 --threads 8 --worker-class gthread --timeout 60
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: CTA_API_KEY
        sync: false           # set in Render dashboard
      - key: DELAY_PREDICTOR_URL
        sync: false           # set to https://cta-delay-api.onrender.com
      - key: SITE_ENV
        value: production

  # ── Delay predictor FastAPI ──────────────────────────────────────────────────
  - type: web
    name: cta-delay-api
    runtime: python
    rootDir: cta-delay-predictor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: CTA_TRAIN_TRACKER_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://chicagolmap.onrender.com,https://chicagolmap-dev.onrender.com"
