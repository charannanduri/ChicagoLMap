name: iOS App

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Archive and upload to TestFlight (requires ASC secrets)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Compile check + simulator app artifact (works without any Apple account) ──
  build-simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ChicagoLMap.xcodeproj \
            -scheme ChicagoLMap \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log | grep -E 'error:|warning:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' xcodebuild.log

      - name: Show errors on failure
        if: failure()
        working-directory: ios
        run: grep -E 'error:' xcodebuild.log | head -80 || tail -100 xcodebuild.log

      # GitHub always re-zips whatever upload-artifact is given, so we must NOT
      # hand it a .zip (that double-zips → Appetize sees a zip, not a .app).
      # We stage the .app next to a sibling readme so upload-artifact's
      # least-common-ancestor is the staging dir — that keeps the
      # "ChicagoLMap.app/" folder at the root of the downloaded artifact zip,
      # which is exactly what Appetize expects.
      - name: Stage simulator app for artifact
        working-directory: ios
        run: |
          mkdir -p artifact
          cp -R build/Build/Products/Debug-iphonesimulator/ChicagoLMap.app artifact/
          cat > artifact/HOW-TO-RUN.txt <<'EOF'
          Upload this whole downloaded zip to https://appetize.io — it contains
          ChicagoLMap.app at the root. If a tool asks for a .app specifically,
          unzip first and point it at ChicagoLMap.app.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ChicagoLMap-Simulator
          path: ios/artifact
          retention-days: 90

      # ── Unsigned device build → .ipa ────────────────────────────────────────
      # The simulator .app above cannot run on a real iPhone: wrong architecture
      # and no signature. This produces a device-architecture .ipa instead.
      # It is UNSIGNED, so it still can't be installed directly — iOS requires a
      # signature — but sideloading tools (AltStore, SideStore, Sideloadly) sign
      # it with your own Apple ID at install time. See ios/README.md.
      - name: Build unsigned device binary
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ChicagoLMap.xcodeproj \
            -scheme ChicagoLMap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild-device.log | grep -E 'error:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' xcodebuild-device.log

      - name: Show device build errors on failure
        if: failure()
        working-directory: ios
        run: grep -E 'error:' xcodebuild-device.log | head -80 || tail -100 xcodebuild-device.log

      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          # An .ipa is just a zip with the app inside a top-level Payload/ dir.
          rm -rf Payload
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/ChicagoLMap.app Payload/
          zip -r -q ChicagoLMap-unsigned.ipa Payload
          ls -lh ChicagoLMap-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ChicagoLMap-unsigned-ipa
          path: ios/ChicagoLMap-unsigned.ipa
          retention-days: 90

  # ── TestFlight upload (manual; needs App Store Connect API key secrets) ──────
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see ios/README.md"
            exit 1
          fi

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XCODE"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ChicagoLMap.xcodeproj \
            -scheme ChicagoLMap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ChicagoLMap.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -40

      - name: Write export options
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Export and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Fail with something readable if archiving quietly produced nothing.
          if [ ! -d build/ChicagoLMap.xcarchive ]; then
            echo "::error::No archive was produced — check the Archive step above."
            exit 1
          fi
          xcodebuild \
            -exportArchive \
            -archivePath build/ChicagoLMap.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summarise the upload
        if: success()
        run: |
          {
            echo "### Uploaded to TestFlight :rocket:"
            echo ""
            echo "- **Version** 1.0 (build **${{ github.run_number }}**)"
            echo "- **Commit** \`${GITHUB_SHA:0:8}\`"
            echo ""
            echo "Apple takes roughly 5–15 minutes to finish processing."
            echo "It then appears in TestFlight on any device signed in as an internal tester."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive on failure for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-archive-logs
          path: |
            ios/build/ChicagoLMap.xcarchive/Info.plist
            ios/ExportOptions.plist
          retention-days: 14
          if-no-files-found: ignore
