name: Retrain Model

on:
  schedule:
    - cron: '0 5 * * 0'    # every Sunday at 5am UTC
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cta-delay-predictor/requirements.txt

      - name: Install dependencies
        run: pip install -r cta-delay-predictor/requirements.txt

      - name: Train model
        working-directory: cta-delay-predictor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.ml.train

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-models-${{ github.run_id }}
          path: cta-delay-predictor/ml_models/
          retention-days: 90
