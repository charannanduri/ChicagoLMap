name: Full ETL Reprocess

# Run manually from the GitHub Actions tab.
# Step 1: backfill_timestamps  — fixes NULL arr_t in rows collected before date-format bug
# Step 2: arrival_inference    — infers actual arrivals from ALL snapshots
# Step 3: feature_builder      — builds model_features from ALL snapshots
# Step 4: retrain              — trains models on newly labeled data
# Step 5: commit models        — pushes .joblib files so Render redeploys with new models

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cta-delay-predictor/requirements.txt

      - name: Install dependencies
        run: pip install -r cta-delay-predictor/requirements.txt

      - name: Backfill NULL timestamps from raw_json
        working-directory: cta-delay-predictor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.etl.backfill_timestamps

      - name: Infer actual arrivals (all history)
        working-directory: cta-delay-predictor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.etl.arrival_inference --all

      - name: Build model features (all history)
        working-directory: cta-delay-predictor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.etl.feature_builder --all

      - name: Train models
        working-directory: cta-delay-predictor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.ml.train

      - name: Commit model artifacts so Render picks them up
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cta-delay-predictor/ml_models/*.joblib
          git diff --cached --quiet || git commit -m "chore: update trained model artifacts [skip ci]"
          git push

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-models-reprocess-${{ github.run_id }}
          path: cta-delay-predictor/ml_models/
          retention-days: 90
