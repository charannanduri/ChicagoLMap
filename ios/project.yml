name: ChicagoLMap
options:
  bundleIdPrefix: com.charannanduri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
targets:
  ChicagoLMap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChicagoLMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charannanduri.chicagolmap
        INFOPLIST_KEY_CFBundleDisplayName: "Chicago L Map"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to suggest the nearest stations and trains when you board."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
